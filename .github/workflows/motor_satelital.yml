name: Motor satelital (Sentinel-2, humedad urbana)

on:
  schedule:
    - cron: "30 13 */5 * *"   # cada 5 días, 7:30 hora de Gómez Palacio (revisita Sentinel-2)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: motor-satelital
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: satelite/motor/requirements.txt
      - name: Instalar dependencias
        run: pip install -r satelite/motor/requirements.txt
      - name: Correr motor
        run: python satelite/motor/motor.py --sin-png
      - name: Guardar resultados solo si cambiaron
        run: |
          git config user.name "motor-satelital[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodo-vah-4d/data/satelite satelite/motor/estado/seguimiento.json satelite/motor/cache/osm_gp.json
          # el motor no reescribe un archivo si solo cambiaría la hora de generación
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Motor satelital: corrida $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
          echo "PUBLICAR=1" >> "$GITHUB_ENV"
      - name: Publicar en GitHub Pages
        # los commits hechos con GITHUB_TOKEN no disparan otros workflows; se lanza pages.yml a mano
        if: env.PUBLICAR == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
