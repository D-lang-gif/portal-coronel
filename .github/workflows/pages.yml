name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # El despliegue va en un job aparte (flujo recomendado por GitHub).
  # Si upload y deploy corren en el mismo job, a veces deploy-pages no alcanza
  # a ver el artefacto y falla con «Found 0 artifact(s)».
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Iconos PNG de Coronel En Vivo
        run: python3 envivo/img/hacer_iconos.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
